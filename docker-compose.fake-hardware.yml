# Simulate real 2-PC cooperation via DDS + Bridge Network (no real robot needed).
#
# mock-robot  = Robot PC  — publishes synthetic camera frames and joint states
# monitor/inference = GPU PC — subscribes via CycloneDDS over the bridge network
#
# Profiles:
#   monitor       — FPS monitoring only (validates DDS connectivity + throughput, no GPU)
#   inference     — full pipeline: model load → preprocess → select_action → publish (GPU)
#   replay        — no model: replays a converted dataset's recorded GT actions through
#                   the real inference pipeline (dataset_gt_replayer_node), CPU-only.
#                   See claude_docs/dataset-gt-replayer-plan.md.
#   replay-verify — mock-robot + replay + gt-replay-verify (live correctness check of
#                   the replay run against the dataset's own recorded trajectory).
#                   Brought up in explicit stages by tests/smoke/scripts/
#                   gt_replay_correctness_test.py, not all at once — see that script.
#                   See claude_docs/gt-replayer-correctness-test-plan.md.
#
# Usage:
#   # Monitor only (validates DDS + FPS, no model needed)
#   docker compose -f docker-compose.fake-hardware.yml --profile monitor up --build
#
#   # Full GPU inference — MODEL_PATH must be an absolute path or start with ./
#   MODEL_PATH=$(pwd)/model_zoo/my-task/checkpoints/last \
#   docker compose -f docker-compose.fake-hardware.yml --profile inference up --build
#
#   # GT replay — DATASET_PATH must be an absolute path or start with ./
#   EE_MODE=true DATASET_PATH=$(pwd)/data/debug/ee-delta/ee-delta/ee-space-testing \
#   CONFIG_FILE=./configs/lerobot_control/inference_ee.yaml \
#   docker compose -f docker-compose.fake-hardware.yml --profile replay up --build
#
#   # GT replay correctness test — use the driver script, not this compose file
#   # directly (it needs staged bring-up + a computed EE_SEED_POSE):
#   uv run python tests/smoke/scripts/gt_replay_correctness_test.py
#
# Optional env overrides:
#   ROS_DOMAIN_ID — ROS domain (default: 42)
#   CAMERA_RES    — 480p | 720p (default: 480p)
#   CAMERA_FPS    — camera publish rate (default: 30)
#   CONFIG_FILE   — host path to config yaml (default: ./configs/lerobot_control/inference_default.yaml)
#   IMAGE_TAG     — Docker image tag (default: latest)
#   CONTROL_FREQ  — target action publish rate in Hz; robot receives this many commands/sec (default: 30.0)
#   HF_CACHE      — host path to HuggingFace cache (default: ~/.cache/huggingface)
#                   VLA models (pi0/pi05/smolvla) need the PaliGemma tokenizer from this cache.
#   EE_MODE       — true to enable EE-space mock (publishes /ee_pose_<arm>, echoes
#                   received /commanded_ee_<arm> back as the next observation —
#                   see fake_hardware_node.py module docstring). Default: false
#                   (joint-space mock, unchanged). Use CONFIG_FILE=configs/lerobot_control/
#                   inference_ee.yaml (or your ee_delta config) alongside this.
#   EE_ARMS       — comma-separated arm ids for EE mode (default: left,right)
#   EE_POSE_FPS   — /ee_pose_<arm> publish rate in Hz for EE mode (default: 100.0)
#   DATASET_PATH  — (replay profile) host path to the converted dataset (REQUIRED for --profile replay)
#   EPISODE       — (replay profile) episode index to replay (default: 0)
#   LOOP          — (replay profile) restart from episode start when replay completes (default: false)
#   HOLD_LAST     — (replay profile) hold last command on completion vs. shut down (default: true)
#   DRY_RUN       — (replay profile) log rows without publishing them (default: false)
#   EE_SEED_POSE  — (replay-verify profile) comma-separated flat floats seeding the mock's
#                   initial EE pose — see fake_hardware_node.py's ee_seed_pose param.
#                   Computed by gt_replay_correctness_test.py from the dataset's own
#                   first recorded observation.state row. Default: "" (hardcoded default pose).
#   REPORTS_DIR   — (replay-verify profile) host dir the verifier writes its JSON report
#                   into (default: ./tests/smoke/.gt_replay_reports)
#   VERIFY_TIMEOUT_SEC — (replay-verify profile) verifier safety timeout (default: 60.0)
#   COMPLETION_SIGNAL_DIR — (replay profile) host dir the replayer writes its per-episode
#                   completion sentinel into, as episode_<EPISODE>.json (default:
#                   ./tests/smoke/.gt_replay_reports/human_eval_signals). Used by
#                   scripts/gt_replay_human_eval.py's --target fake dry-run mode.
#   HOME_BEFORE_REPLAY — (replay profile) home to the episode's frame-0 pose and confirm
#                   arrival before GT playback begins (default: false here — the mock's
#                   EE_SEED_POSE already provides an instant, exact seed, so homing is
#                   off by default against it; scripts/gt_replay_human_eval.py sets this
#                   per --target).
#   HOME_ATOL_POS_M / HOME_ATOL_ROT_DEG / HOMING_TIMEOUT_SEC — (replay profile) homing
#                   arrival tolerances/timeout, only relevant when HOME_BEFORE_REPLAY=true
#                   (defaults: 0.01m / 5.0deg / 30.0s).
#   HOME_MAX_POS_DELTA_M / HOME_MAX_ROT_DELTA_DEG — (replay profile) max homing approach
#                   speed per publish tick — inference_node's joint-space action_limiter
#                   isn't applied in EE mode, so this ramps the one-shot homing command
#                   instead of jumping straight to the target (defaults: 0.01m / 2.0deg).
#
# EE-mode example:
#   EE_MODE=true CONFIG_FILE=./configs/lerobot_control/inference_ee.yaml \
#   MODEL_PATH=$(pwd)/model_zoo/ee-space/my-dataset/checkpoints/last \
#   docker compose -f docker-compose.fake-hardware.yml --profile inference up --build

x-base: &base
  image: ghcr.io/anvil-robotics/lerobot-inference:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: docker/inference/Dockerfile
    args:
      LEROBOT_VERSION: ${LEROBOT_VERSION:-0.5.1}
      LEROBOT_EXTRAS: ${LEROBOT_EXTRAS:-}
  networks:
    - ros2_test
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - CYCLONEDDS_URI=file:///workspace/configs/cyclonedds/test_bridge.xml
  volumes:
    - ./configs:/workspace/configs:ro

services:

  mock-robot:
    <<: *base
    container_name: lerobot-fake-robot
    profiles: [monitor, inference, replay, replay-verify]
    command: >
      ros2 run lerobot_control mock_controller_node
        --ros-args
        -p timeout:=3600.0
        -p required_actions:=999999
        -p camera_resolution:=${CAMERA_RES:-480p}
        -p camera_fps:=${CAMERA_FPS:-30}
        -p ee_mode:=${EE_MODE:-false}
        -p ee_arms:=${EE_ARMS:-left,right}
        -p ee_pose_fps:=${EE_POSE_FPS:-100.0}
        ${EE_SEED_POSE:+-p ee_seed_pose:=${EE_SEED_POSE}}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f mock_controller_node > /dev/null"]
      start_period: 5s
      interval: 2s
      timeout: 3s
      retries: 15

  monitor:
    <<: *base
    container_name: lerobot-fake-monitor
    profiles: [monitor]
    volumes:
      - ${CONFIG_FILE:-./configs/lerobot_control/inference_default.yaml}:/workspace/config.yaml:ro
    depends_on:
      mock-robot:
        condition: service_healthy
    command: >
      ros2 launch lerobot_control inference.launch.py
        echo_topic_only:=true
        config_file:=/workspace/config.yaml
        mock_ee_pose_echo:=true

  inference:
    <<: *base
    container_name: lerobot-fake-inference
    profiles: [inference]
    volumes:
      # MODEL_PATH is required for --profile inference (see header comment for usage).
      # CONFIG_FILE defaults to inference_default.yaml if not set.
      - ${MODEL_PATH:-/dev/null}:/workspace/model:ro
      - ${CONFIG_FILE:-./configs/lerobot_control/inference_default.yaml}:/workspace/config.yaml:ro
      # HuggingFace model cache — VLA models (pi0/pi05/smolvla) need the PaliGemma tokenizer
      # at runtime. Set HF_CACHE to your host ~/.cache/huggingface when using a VLA model.
      # ACT/Diffusion models are unaffected if this is empty.
      # HuggingFace needs write access to create lock files when loading tokenizers.
      - ${HF_CACHE:-.docker_empty_hf_cache}:/root/.cache/huggingface
    depends_on:
      mock-robot:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # MODEL_PATH is mounted at /workspace/model. HF cache structure (blobs/ + snapshots/)
    # is auto-detected by inference_node — no need for MODEL_SNAPSHOT_PATH.
    command: ros2 launch lerobot_control inference.launch.py model_path:=/workspace/model config_file:=/workspace/config.yaml debug:=${DEBUG:-false} control_frequency:=${CONTROL_FREQ:-30.0} mock_ee_pose_echo:=true

  replay:
    <<: *base
    container_name: lerobot-fake-replay
    profiles: [replay, replay-verify]
    volumes:
      # DATASET_PATH is required for --profile replay (see header comment for usage).
      # CONFIG_FILE defaults to inference_default.yaml if not set.
      - ${DATASET_PATH:-/dev/null}:/workspace/dataset:ro
      - ${CONFIG_FILE:-./configs/lerobot_control/inference_default.yaml}:/workspace/config.yaml:ro
      - ${COMPLETION_SIGNAL_DIR:-./tests/smoke/.gt_replay_reports/human_eval_signals}:/workspace/signals
    depends_on:
      mock-robot:
        condition: service_healthy
    # No model, no GPU — dataset_gt_replayer_node reads recorded actions from
    # /workspace/dataset and injects them at the model-prediction seam.
    command: >
      ros2 launch lerobot_control dataset_gt_replay.launch.py
        dataset:=/workspace/dataset config_file:=/workspace/config.yaml
        episode:=${EPISODE:-0} loop:=${LOOP:-false} hold_last:=${HOLD_LAST:-true}
        dry_run:=${DRY_RUN:-false} debug:=${DEBUG:-false} control_frequency:=${CONTROL_FREQ:-30.0}
        completion_signal_path:=/workspace/signals/episode_${EPISODE:-0}.json
        home_before_replay:=${HOME_BEFORE_REPLAY:-false}
        home_atol_pos_m:=${HOME_ATOL_POS_M:-0.05}
        home_atol_rot_deg:=${HOME_ATOL_ROT_DEG:-10.0}
        homing_timeout_sec:=${HOMING_TIMEOUT_SEC:-30.0}
        home_max_pos_delta_m:=${HOME_MAX_POS_DELTA_M:-0.01}
        home_max_rot_delta_deg:=${HOME_MAX_ROT_DELTA_DEG:-2.0}
        mock_ee_pose_echo:=true

  gt-replay-verify:
    <<: *base
    container_name: lerobot-gt-replay-verify
    profiles: [replay-verify]
    volumes:
      # DATASET_PATH must match the `replay` service's dataset for this run.
      - ${DATASET_PATH:-/dev/null}:/workspace/dataset:ro
      - ${REPORTS_DIR:-./tests/smoke/.gt_replay_reports}:/workspace/reports
    depends_on:
      mock-robot:
        condition: service_healthy
    # Staged bring-up (mock-robot -> gt-replay-verify -> replay, with a DDS-discovery
    # delay between each) is the driver script's job — see tests/smoke/scripts/
    # gt_replay_correctness_test.py. Depending only on mock-robot here (not on
    # `replay`) is deliberate: the verifier must already be subscribed before
    # `replay` starts publishing, so it cannot depend on `replay` being up first.
    command: >
      ros2 run lerobot_control gt_replay_verifier_node
        --ros-args
        -p dataset:=/workspace/dataset
        -p episode:=${EPISODE:-0}
        -p arms:=${EE_ARMS:-left,right}
        -p report_path:=/workspace/reports/gt_replay_report.json
        -p timeout_sec:=${VERIFY_TIMEOUT_SEC:-60.0}

networks:
  ros2_test:
    driver: bridge
