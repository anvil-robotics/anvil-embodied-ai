name: mcap-viz
services:
  static:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ${MCAP_VIZ_DATASET_ROOT}:/srv/dataset:ro
      - ${MCAP_VIZ_NGINX_CONF}:/etc/nginx/nginx.conf:ro
    restart: "no"

  frontend:
    image: mcap-viz-frontend:local
    build:
      context: ${MCAP_VIZ_VISUALIZER_DIR}
    network_mode: host
    environment:
      - PORT=${FRONTEND_PORT}
      - DATASET_URL=http://localhost:${STATIC_PORT}
    depends_on:
      - static
    restart: "no"
