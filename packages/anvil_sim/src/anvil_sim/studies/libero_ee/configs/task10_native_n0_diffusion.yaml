# =============================================================================
# LIBERO validation-harness spec — native-family Diffusion coverage (E-diff).
# Same native family (8-dim obs, lerobot-train raw) and same eval decode as
# task10_native_n0_act.yaml, only policy_type flipped to diffusion.
# Purpose: complete the ACT+Diffusion native-family matrix to decide the
# EE relative-position recipe. This condition = per-frame relative (KEY: robust like native, or fragile like world-n0?).
# =============================================================================

name: task10-native-n0-diffusion
task_index: 10
env_suite: libero_goal
env_task_id: 8
dataset_group: native_n0
train:
  trainer: lerobot-train
  policy_type: diffusion
  steps: 30000
  batch_size: 16
  output_dir: model_zoo/native/libero-task10-native-n0/diffusion
eval:
  action_type: native_n0
  control_mode: relative
  n_episodes: 50
gates:
  gt_replay_margin: 15.0
