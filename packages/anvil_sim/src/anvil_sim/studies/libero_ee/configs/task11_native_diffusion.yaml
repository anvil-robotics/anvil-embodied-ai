# =============================================================================
# LIBERO validation-harness spec — native reference ceiling on task11, Diffusion.
# The rotation-HEAVY-task counterpart to task10_native_diffusion.yaml: raw
# native delta command (world frame, per-frame relative delivery), Diffusion.
# Provides the per-task Diffusion ceiling to read task11_native_n0_diffusion
# against (native_n0 close to this => recipe generalizes; far below => task
# dependency). Completes the task11 native/native_n0 x ACT/Diffusion 2x2.
# Run: uv run --package anvil-sim anvil-sim-bench run configs/libero_bench/task11_native_diffusion.yaml
# =============================================================================

name: task11-native-diffusion
task_index: 11
env_suite: libero_goal
env_task_id: 9
dataset_group: native
train:
  trainer: lerobot-train
  policy_type: diffusion
  steps: 30000
  batch_size: 16
  output_dir: model_zoo/native/libero-task11-native/diffusion
eval:
  action_type: native
  control_mode: relative
  n_episodes: 50
