# =============================================================================
# LIBERO validation-harness spec — Experiment 7: world-frame consecutive, absolute delivery, reuses ee_delta checkpoint (10%)
# Historical experiment re-expressed as a bench spec (see
# packages/anvil_sim/README.md for the experiment's full story).
# Run: uv run --package anvil-sim anvil-sim-bench run configs/libero_bench/task10_goal_world_seq_act.yaml
# =============================================================================

name: task10-goal-world-seq-act
task_index: 10
env_suite: libero_goal
env_task_id: 8
dataset_group: delta
train:
  trainer: anvil-trainer
  action_type: ee_abs
  policy_type: act
  steps: 50000
  batch_size: 16
  reuse_checkpoint: model_zoo/ee-space/libero-task10-delta/act/checkpoints/last/pretrained_model
eval:
  action_type: zerocal_goal_world_seq
  control_mode: absolute
  n_episodes: 10
gates:
  # gt-replay gate deliberately skipped for the LEDGER BACKFILL of this
  # historical condition: GT replay through this eval path scores
  # measured 0% vs native baseline 60% — absolute-mode delivery DIVERGES in open loop (1.48x demo displacement, 0.675m drift) - see README Experiment 8.
  # The gate verdict is itself the finding; a NEW treatment must not skip this.
  skip: [gt-replay]
