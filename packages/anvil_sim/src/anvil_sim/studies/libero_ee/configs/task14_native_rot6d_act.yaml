# =============================================================================
# LIBERO validation-harness spec — rot6d-encoding isolation on the
# MEDIUM-rotation task. Experiment E3 third robustness point: task_index=14
# "put the wine bottle on top of the cabinet" (libero_goal task_id=2),
# rot_rms 0.0125 rad/step — midway between task 10 (0.0082) and task 11
# (0.0258). Tests whether the rot6d penalty scales monotonically with rotation.
# Run: uv run --package anvil-sim anvil-sim-bench run configs/libero_bench/task14_native_rot6d_act.yaml
# =============================================================================

name: task14-native-rot6d-act
task_index: 14
env_suite: libero_goal
env_task_id: 2
dataset_group: native_rot6d
train:
  trainer: lerobot-train
  policy_type: act
  steps: 50000
  batch_size: 16
eval:
  action_type: native_rot6d
  control_mode: relative
  n_episodes: 50
