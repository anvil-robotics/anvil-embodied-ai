# =============================================================================
# LIBERO validation-harness spec — Experiment 4: world-frame consecutive delta, calibrated legacy path, ACT (10%)
# Historical experiment re-expressed as a bench spec (see
# packages/anvil_sim/README.md for the experiment's full story).
# Run: uv run --package anvil-sim anvil-sim-bench run configs/libero_bench/task10_ee_delta_act.yaml
# =============================================================================

name: task10-ee-delta-act
task_index: 10
env_suite: libero_goal
env_task_id: 8
dataset_group: delta
train:
  trainer: anvil-trainer
  action_type: ee_abs
  policy_type: act
  steps: 50000
  batch_size: 16
eval:
  action_type: ee_delta
  control_mode: relative
  n_episodes: 10
gates:
  # gt-replay gate deliberately skipped for the LEDGER BACKFILL of this
  # historical condition: GT replay through this eval path scores
  # measured 20% vs native baseline 60% — calibrated open-loop consecutive delta is the worst execution path measured.
  # The gate verdict is itself the finding; a NEW treatment must not skip this.
  skip: [gt-replay]
