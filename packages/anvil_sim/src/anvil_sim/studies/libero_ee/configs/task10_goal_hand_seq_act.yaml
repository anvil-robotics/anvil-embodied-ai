# =============================================================================
# LIBERO validation-harness spec — Experiment 7: hand-frame consecutive, absolute delivery, ACT (10%)
# Historical experiment re-expressed as a bench spec (see
# packages/anvil_sim/README.md for the experiment's full story).
# Run: uv run --package anvil-sim anvil-sim-bench run configs/libero_bench/task10_goal_hand_seq_act.yaml
# =============================================================================

name: task10-goal-hand-seq-act
task_index: 10
env_suite: libero_goal
env_task_id: 8
dataset_group: delta_hand
train:
  trainer: anvil-trainer
  action_type: ee_abs
  policy_type: act
  steps: 50000
  batch_size: 16
  output_dir: model_zoo/ee-space/libero-task10-delta-hand/goal2deltahand-act
eval:
  action_type: zerocal_goal_hand_seq
  control_mode: absolute
  n_episodes: 10
gates:
  # gt-replay gate deliberately skipped for the LEDGER BACKFILL of this
  # historical condition: GT replay through this eval path scores
  # expected ~0% (not separately measured) — absolute-mode delivery diverges in open loop (same mechanism as world-seq).
  # The gate verdict is itself the finding; a NEW treatment must not skip this.
  skip: [gt-replay]
