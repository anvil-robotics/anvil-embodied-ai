# =============================================================================
# LIBERO validation-harness spec — Experiment E2: formal goal target,
# recovered-delta relative delivery, DIFFUSION. Tests whether goal-abs's
# ACT dominance (100% on task10) is architecture-independent.
# Run: uv run --package anvil-sim anvil-sim-bench run configs/libero_bench/task10_goal_abs_diffusion.yaml
# =============================================================================

name: task10-goal-abs-diffusion
task_index: 10
env_suite: libero_goal
env_task_id: 8
dataset_group: goalabs
train:
  trainer: anvil-trainer
  action_type: ee_abs
  policy_type: diffusion
  steps: 30000
  batch_size: 16
eval:
  action_type: zerocal_goal_abs
  control_mode: relative
  n_episodes: 50
