[project]
name = "anvil-sim"
version = "0.1.0"
description = "Anvil sim benchmark — verify the ee_abs/ee_rel training + closed-loop eval pipeline against LIBERO"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Anvil Robotics", email = "dev@anvil.bot" }
]
keywords = ["robotics", "simulation", "libero", "lerobot", "imitation-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "lerobot[libero]~=0.5.1",
    "torch>=2.2.1,<2.11.0",
    "numpy>=2.0.0,<2.3.0",
    "anvil-shared",
    "mcap-converter",
]

[tool.uv.sources]
anvil-shared = { workspace = true }
mcap-converter = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
anvil-libero-convert = "anvil_sim.libero_convert:main"
anvil-eval-libero = "anvil_sim.eval_libero_ee:main"
anvil-eval-native-rot6d = "anvil_sim.eval_native_rot6d:main"

[project.urls]
Homepage = "https://github.com/anvil-robotics/anvil-embodied-ai"
Repository = "https://github.com/anvil-robotics/anvil-embodied-ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil_sim"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
