# UMI-matched image augmentation ("v5a-umi-matched-augmentation-max5"), replicated
# from an existing production run's train_config.json (model_zoo/ee-space/
# pick-and-place-hand-switch-cat-plushie-open-env-s3/diffusion_20260702_145619).
# Pass via `--image_transforms=configs/anvil_trainer/image_transforms_umi_v5a.yaml`.
enable: true
max_num_transforms: 5
random_order: false
tfs:
  brightness:
    weight: 1.0
    type: ColorJitter
    kwargs:
      brightness: [0.7, 1.3]
  contrast:
    weight: 1.0
    type: ColorJitter
    kwargs:
      contrast: [0.6, 1.4]
  saturation:
    weight: 1.0
    type: ColorJitter
    kwargs:
      saturation: [0.5, 1.5]
  hue:
    weight: 1.0
    type: ColorJitter
    kwargs:
      hue: [-0.08, 0.08]
  affine:
    weight: 1.0
    type: RandomAffine
    kwargs:
      degrees: [-5.0, 5.0]
      translate: [0.05, 0.05]
