# =============================================================================
# OpenArm MCAP to LeRobot — EE Cartesian, DELTA (n-(n-1)) encoding, BIMANUAL —
# DEBUG TEMPLATE for real session data
# =============================================================================
#
# Same as openarm_ee_delta_debug.yaml (single right arm, synthetic fixtures)
# but bimanual, matching a real recorded session's topic layout — e.g.
# data/raw_sessions/ee-space-testing (both /ee_pose_left and /ee_pose_right).
#
#   uv run mcap-convert \
#     -i data/raw_sessions/ee-space-testing \
#     -o data/debug/ee-delta \
#     --config configs/mcap_converter/v1.1/openarm_ee_bimanual_delta_debug.yaml
#
# Output lands at data/debug/ee-delta/ee-delta-space/ee-space-testing/.
#
# Output (per frame):
#   observation.state  float32 (16,) = [left: x,y,z,qx,qy,qz,qw,gripper][right: same]
#   action             float32 (20,) = [left: x,y,z,rot6d(6),gripper][right: same]  (baked delta)
#     action[t] = ee_delta_forward(pose[t], pose[t-1]) for t >= 1, self-anchored at t=0
#
# Next step — gate it before trusting the output:
#   uv run anvil-gt-replay --dataset data/debug/ee-delta/ee-delta-space/ee-space-testing --encoding auto
# =============================================================================

schema_version: "1.1"
data_space: "ee"

action_encoding: "delta"

# Explicit for self-documentation — this file demonstrates action_encoding="delta"
# paired with the default observation_encoding, not a rot6d/axis_angle observation
# (see openarm_ee_bimanual_rot6d_obs_debug.yaml for that combination).
observation_encoding: "quaternion"

observation_topics:
  left:  "/ee_pose_left"
  right: "/ee_pose_right"

action_topics: {}

camera_topics:
  - "/cam_waist/image_raw/compressed"
  - "/cam_wrist_r/image_raw/compressed"
  - "/cam_chest/image_raw/compressed"
  - "/cam_wrist_l/image_raw/compressed"

camera_topic_mapping:
  "/cam_waist/image_raw/compressed":  "waist"
  "/cam_wrist_r/image_raw/compressed": "wrist_r"
  "/cam_chest/image_raw/compressed":  "chest"
  "/cam_wrist_l/image_raw/compressed": "wrist_l"

image_resolution: [640, 480]
