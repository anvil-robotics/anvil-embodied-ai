# =============================================================================
# OpenArm MCAP to LeRobot — EE Cartesian, DELTA (n-(n-1)) encoding, single
# right arm — DEBUG TEMPLATE
# =============================================================================
#
# This is the first config in the repo that actually sets
# `action_encoding: "delta"` (renamed from `ee_action_encoding` in schema
# v1.1 — see claude_docs/mcap-converter-encoding-refactor-plan.md; old
# configs using the pre-rename key are transparently migrated, see
# mcap_converter.config.versioning). As of the original architecture-report
# audit, no shipped config exercised this path — every existing
# openarm_ee_*.yaml defaults to "absolute". Use this file to drive Flow A
# end-to-end and confirm the baking path (extractor.py's
# `_align_ee_signals` -> `ee_delta_forward`) actually runs through the real
# CLI, not just via the unit tests that construct DataConfig directly.
#
# Topic/camera layout intentionally matches
# tests/smoke/fixtures/ee-session/{0001..0005}/ (5 synthetic episodes,
# single right arm, 30 fps, generated by
# tests/smoke/fixtures/scripts/generate_ee_fixtures.py) so this config is
# runnable immediately with zero real hardware / real session data:
#
#   uv run mcap-convert \
#     -i tests/smoke/fixtures/ee-session \
#     -o /tmp/ee-delta-debug \
#     --config configs/mcap_converter/v1.1/openarm_ee_delta_debug.yaml
#
# Output lands at /tmp/ee-delta-debug/ee-delta-space/ee-session/ (the
# "ee-delta-space" suffix, not "ee-space", is convert.py's own signal that
# is_ee_delta actually fired — check this before anything else).
#
# Output (per frame):
#   observation.state  float32 (8,)   = [x,y,z, qx,qy,qz,qw, gripper]        (always absolute)
#   action             float32 (10,)  = [x,y,z, rot6d(6), gripper]          (baked delta, NOT absolute)
#     action[0]  = self-anchored zero-delta (identity rot6d, zero xyz)       — first-frame convention
#     action[t]  = ee_delta_forward(pose[t], pose[t-1]) for t >= 1           — world-frame, per-frame
#   observation.images.{waist,wrist_r,chest}                                 (matches the fixture's 3 camera topics)
#
# Next step after converting — gate it before trusting the output, per
# claude_docs/ee-delta-flow-plan.md Item 3:
#
#   uv run anvil-gt-replay \
#     --dataset /tmp/ee-delta-debug/ee-delta-space/ee-session \
#     --encoding delta
#
# This recomputes the expected delta from observation.state (via
# ee_obs_abs_forward + ee_delta_forward) and diffs it against the actual
# on-disk `action` column mcap-convert just wrote — exactly the check that
# has never been run through the real CLI before.
# =============================================================================

schema_version: "1.1"
data_space: "ee"

# The only field that distinguishes this file from openarm_ee_left.yaml /
# mcap-converter-smoke-test-ee.yaml. "absolute" (the default) writes action
# as the absolute EE pose, byte-identical to observation.state's pose just
# re-encoded as rot6d — that's what every other shipped EE config still does.
action_encoding: "delta"

# Explicit for self-documentation, even though "quaternion" is also the default —
# this file specifically demonstrates action_encoding="delta" paired with the
# default observation_encoding, not a rot6d/axis_angle observation (see
# openarm_ee_rot6d_obs_debug.yaml for that combination).
observation_encoding: "quaternion"

observation_topics:
  right: "/ee_pose_right"

# Mandatory empty in EE mode — action is derived from the same /ee_pose_<arm>
# topic used for observation, not a separate command topic.
action_topics: {}

camera_topics:
  - "/cam_waist/image_raw/compressed"
  - "/cam_wrist_r/image_raw/compressed"
  - "/cam_chest/image_raw/compressed"

camera_topic_mapping:
  "/cam_waist/image_raw/compressed": "waist"
  "/cam_wrist_r/image_raw/compressed": "wrist_r"
  "/cam_chest/image_raw/compressed": "chest"

image_resolution: [640, 480]
