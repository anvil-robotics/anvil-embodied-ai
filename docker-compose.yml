services:
  inference:
    image: ghcr.io/anvil-robotics/lerobot-inference:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/inference/Dockerfile
      args:
        LEROBOT_VERSION: ${LEROBOT_VERSION:-0.5.1}
        LEROBOT_EXTRAS: ${LEROBOT_EXTRAS:-}
    container_name: lerobot-inference
    network_mode: host
    ipc: host
    privileged: true
    # Default 10s grace period on stop was observed to be too short for a
    # clean shutdown (ros2 launch's own --sigterm-timeout/--sigkill-timeout
    # forwarding overhead stacked with strategy.cleanup()'s worker join),
    # resulting in SIGKILL (exit 137) before image-worker video writers could
    # release — corrupted mp4s (missing moov atom).
    stop_grace_period: 30s
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///workspace/configs/cyclonedds/single_pc.xml}
      - ECHO_TOPIC_ONLY=${ECHO_TOPIC_ONLY:-false}
      - DEBUG=${DEBUG:-false}
      - MONITOR_ENABLE=${MONITOR_ENABLE:-false}
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Both MODEL_PATH and CONFIG_FILE are host paths — tab-completion works naturally.
      # CONFIG_FILE defaults to inference_default.yaml if not set.
      - ${MODEL_PATH:?MODEL_PATH is required}:/workspace/model:ro
      - ${CONFIG_FILE:-./configs/lerobot_control/inference_default.yaml}:/workspace/config.yaml:ro
      # HF_CACHE — VLA models (pi0/pi05/smolvla) need PaliGemma tokenizer at runtime.
      # HuggingFace needs write access to create lock files when loading tokenizers.
      - ${HF_CACHE:-.docker_empty_hf_cache}:/root/.cache/huggingface
      # DEBUG=true: pre-model input frames saved here for training/inference comparison
      - ./debug_images:/workspace/debug_images
      # MONITOR_ENABLE=true: per-camera JPEG frame sequences written here during the
      # run; run_inference.sh batch-converts them to mp4 with ffmpeg after the
      # container exits (same dir as monitor CSV/plot)
      - ${MONITOR_OUTPUT_DIR:-./monitor_output}:/workspace/monitor_output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ros2 launch lerobot_control inference.launch.py model_path:=/workspace/model config_file:=/workspace/config.yaml echo_topic_only:=${ECHO_TOPIC_ONLY:-false} debug:=${DEBUG:-false} monitor_enable:=${MONITOR_ENABLE:-false} control_frequency:=${CONTROL_FREQ:-30.0} mock_ee_pose_echo:=false

  gt-replay-real:
    image: ghcr.io/anvil-robotics/lerobot-inference:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/inference/Dockerfile
      args:
        LEROBOT_VERSION: ${LEROBOT_VERSION:-0.5.1}
        LEROBOT_EXTRAS: ${LEROBOT_EXTRAS:-}
    container_name: lerobot-gt-replay-real
    network_mode: host
    ipc: host
    privileged: true
    stop_grace_period: 30s
    profiles:
      - gt-replay-real
    # Real-hardware GT-replay evaluation (scripts/gt_replay_human_eval.py) — one
    # episode per `up`/`down` cycle, orchestrated by that host-side wrapper, not
    # run directly. No model/GPU: dataset_gt_replayer_node reads recorded actions
    # from /workspace/dataset and injects them at the model-prediction seam,
    # exactly like the fake-hardware `replay` service, but against a real robot's
    # own controller stack (assumed already running independently — this service
    # never starts/stops it). See claude_docs/real-hardware-gt-replay-eval-plan.md.
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///workspace/configs/cyclonedds/single_pc.xml}
      - DEBUG=${DEBUG:-false}
    volumes:
      # Soft default (not :?required): this volume belongs to the gt-replay-real
      # profile only, but compose interpolates every service's variables up
      # front regardless of --profile selection — a hard-required var here
      # would abort `up` for every OTHER profile (e.g. plain `monitor`) too.
      # The real requirement is enforced by scripts/gt_replay_human_eval.py,
      # which sets DATASET_PATH before invoking this service.
      - ${DATASET_PATH:-/tmp}:/workspace/dataset:ro
      - ${CONFIG_FILE:-./configs/lerobot_control/inference_ee.yaml}:/workspace/config.yaml:ro
      - ${COMPLETION_SIGNAL_DIR:-./gt_replay_signals}:/workspace/signals
    command: >
      ros2 launch lerobot_control dataset_gt_replay.launch.py
        dataset:=/workspace/dataset config_file:=/workspace/config.yaml
        episode:=${EPISODE:-0} loop:=false hold_last:=true dry_run:=false
        debug:=${DEBUG:-false} control_frequency:=${CONTROL_FREQ:-30.0}
        completion_signal_path:=/workspace/signals/episode_${EPISODE:-0}.json
        home_before_replay:=${HOME_BEFORE_REPLAY:-true}
        home_atol_pos_m:=${HOME_ATOL_POS_M:-0.05}
        home_atol_rot_deg:=${HOME_ATOL_ROT_DEG:-10.0}
        homing_timeout_sec:=${HOMING_TIMEOUT_SEC:-30.0}
        home_max_pos_delta_m:=${HOME_MAX_POS_DELTA_M:-0.01}
        home_max_rot_delta_deg:=${HOME_MAX_ROT_DELTA_DEG:-2.0}
        mock_ee_pose_echo:=false

  inference-monitor:
    image: ghcr.io/anvil-robotics/lerobot-inference:${IMAGE_TAG:-latest}
    container_name: lerobot-inference-monitor
    network_mode: host
    ipc: host
    profiles:
      - monitor
    depends_on:
      - inference
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///workspace/configs/cyclonedds/single_pc.xml}
      - ACTION_TYPE=${ACTION_TYPE:-absolute}
      - JOINT_NAMES=${JOINT_NAMES:-}
    volumes:
      - ${MONITOR_OUTPUT_DIR:-./monitor_output}:/workspace/monitor_output
      # Self-detect action_type from the checkpoint directly (robust regardless of
      # whether ACTION_TYPE env var was correctly threaded through the launcher).
      - ${MODEL_PATH:-.docker_empty_model_path}:/workspace/model:ro
    command: >
      ros2 run lerobot_control inference_monitor_node
        --ros-args
        -p output_dir:=/workspace/monitor_output
        -p action_type:=${ACTION_TYPE:-joint_abs}
        -p model_path:=/workspace/model
